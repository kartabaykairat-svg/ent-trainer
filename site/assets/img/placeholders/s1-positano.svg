  <text x="50%" y="630.0" font-size="192.0" text-anchor="middle" dominant-baseline="central" font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">🌅</text>
  <text x="50%" y="930.0" font-size="54.0" text-anchor="middle" fill="#2b1d14" fill-opacity="0.72" font-family="Georgia, 'Times New Roman', serif" font-style="italic">Побережье Позитано, закат</text>
  <text x="50%" y="1484" font-size="12" letter-spacing="2" text-anchor="middle" fill="#2b1d14" fill-opacity="0.55" font-family="Arial, sans-serif">ФОТО — ЗАМЕНИТЬ</text>
